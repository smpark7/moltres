# This GitHub Action automatically runs pytest for our Python scripts in
# moltres/python in pull requests.

name: Pytest Action

# Activate on pull requests into devel
on:
  pull_request:
    branches: [ devel ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v2

      # Build Conda environment and run pytest
      - name: Build and Run
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: 3.9
          mamba-version: "*"
          channels: conda-forge
          activate-environment: openmc-pyne-pytest
      - shell: bash -l {0}
        run: |
          conda deactivate
          conda activate openmc-pyne
          mamba install openmc pyne
          conda deactivate
          conda activate openmc-pyne
          cd python/test
          pytest
